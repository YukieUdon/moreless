name: 功能建议
description: 想要什么、为什么值得做
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        这个项目刻意保持小：打开 10 秒内解决问题，不制造任务和焦虑。
        提建议前可以先看 [AGENTS.md](https://github.com/YukieUdon/moreless/blob/main/AGENTS.md) 的「产品态度」和「红线」。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 先说场景，不用急着说方案
      placeholder: "例如：每次想买大件，都要自己算很久……"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望的用法
      description: 越具体越好；也可以画个草图
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 有没有别的做法
      description: 现在你是怎么凑合解决的？
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我搜过现有 Issue，没有重复
          required: true
        - label: 这个建议没有越过「不做账号墙 / 本地优先 / 不制造焦虑」的红线
          required: true
